{% extends 'base.html' %}{% block title %}Create Account{% endblock %}{% block auth_content %}<div class="auth-card"><span class="eyebrow">JOIN THE COMMUNITY</span><h2>Create your account</h2><p class="muted">Register as a student or barangay youth.</p><form method="post" class="form-stack"><label>Full name<input name="name" required maxlength="100" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="8" placeholder="Repeat your password"></label><button class="btn primary full" type="submit">Create Account <i data-lucide="user-plus"></i></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
